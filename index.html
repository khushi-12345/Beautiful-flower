<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little Flower</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="garden">
    <div class="moon"></div>
    <div class="stars" id="stars"></div>

    <div class="message">
      <h1>A Little Flower <span>For You</span></h1>
      <p>Sometimes the simplest things are the most beautiful.</p>
    </div>

    <div class="plant">
      <div class="flower" id="flower">
        <div class="petals" id="petals"></div>
        <div class="center"></div>
      </div>

      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
      <div class="ground"></div>
    </div>

    <button id="bloomBtn">Make It Bloom ✿</button>
    <p class="hint">Tap the flower to watch it bloom</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
